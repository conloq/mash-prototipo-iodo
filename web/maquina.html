<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MASH · Máquina do teste de iodo (virtual)</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14110f; color: #f3ede6; }
  .maquina { width: min(560px, 94vw); padding: 24px; border-radius: 22px;
             background: linear-gradient(#3a332e, #2a2420); box-shadow: 0 18px 50px #000a, inset 0 1px 0 #fff2; }
  .marca { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .marca b { letter-spacing: .2em; color: #d98e2b; }
  .marca span { font-size: .75rem; color: #b7aca2; }
  .lcd { padding: 14px 16px; border-radius: 8px; background: #8fae3a; border: 6px solid #1c1916;
         box-shadow: inset 0 0 18px #0006; }
  .lcd pre { margin: 0; font: 600 clamp(14px, 3.6vw, 22px)/1.35 ui-monospace, "Courier New", monospace;
             color: #1e2a0a; white-space: pre; letter-spacing: .04em; }
  .painel { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 20px; }
  .leds { display: flex; gap: 14px; }
  .led { display: grid; justify-items: center; gap: 6px; font-size: .7rem; color: #b7aca2; }
  .led i { width: 18px; height: 18px; border-radius: 50%; background: #333; box-shadow: inset 0 -2px 4px #0008; }
  .led.on i { box-shadow: 0 0 14px var(--c), 0 0 4px var(--c); background: var(--c); }
  #btnAnalisar { width: 110px; height: 110px; border-radius: 50%; border: 6px solid #1c1916; cursor: pointer;
                 background: radial-gradient(circle at 35% 30%, #5fd17a, #23843c); color: #08240f;
                 font-weight: 800; letter-spacing: .05em; box-shadow: 0 6px 0 #0a3a17, 0 10px 20px #0008; }
  #btnAnalisar:active { transform: translateY(4px); box-shadow: 0 2px 0 #0a3a17; }
  details { margin-top: 18px; font-size: .85rem; color: #b7aca2; }
  summary { cursor: pointer; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0; }
  input, select { padding: 6px; background: #14110f; color: #f3ede6; border: 1px solid #4a423b; border-radius: 6px; }
  button.sec { padding: 8px 14px; border: 0; border-radius: 8px; background: #4a423b; color: #f3ede6; cursor: pointer; }
</style>
</head>
<body>
<div class="maquina">
  <div class="marca"><b>MASH</b><span>Teste de iodo · protótipo virtual</span></div>
  <div class="lcd"><pre id="l0"></pre><pre id="l1"></pre><pre id="l2"></pre><pre id="l3"></pre></div>
  <div class="painel">
    <div class="leds">
      <div class="led" id="ledLuz" style="--c:#fff8e0"><i></i>Luz</div>
      <div class="led" id="ledVerde" style="--c:#48e06a"><i></i>Sem amido</div>
      <div class="led" id="ledVermelho" style="--c:#ff4a3d"><i></i>Amido</div>
      <div class="led" id="ledAmarelo" style="--c:#ffd23d"><i></i>Repetir</div>
    </div>
    <button id="btnAnalisar">ANALISAR</button>
  </div>
  <details>
    <summary>Configuração</summary>
    <label>Código da máquina <input id="inCodigo" value="demo01" size="10"></label>
    <label>Modo
      <select id="inModo">
        <option value="auto">Automático</option>
        <option value="local">Local (sem internet)</option>
        <option value="online">Online (MQTT)</option>
      </select>
    </label>
    <button class="sec" id="btnConectar">Conectar</button>
    <p>Modo em uso: <span id="stModo">?</span>. A tecla espaço também aperta ANALISAR.</p>
  </details>
</div>

<script src="comum.js"></script>
<script>
// Mesma lógica do wokwi/sketch.ino, para rodar sem o Wokwi e sem internet.
const TIMEOUT_MS = 15000;    // espera pela câmera
const RESULTADO_MS = 12000;  // tempo do resultado na tela

const $ = id => document.getElementById(id);
const lcd = [0, 1, 2, 3].map(n => $('l' + n));
let estado = 'OCIOSO', inicioEstado = 0, numeroPedido = 0;
let conectado = false, cameraOnline = false, canal = null, audio = null;

// Mantém o que digitou e o modo escolhido
['inCodigo', 'inModo'].forEach(id => {
  const salvo = localStorage.getItem('mash-maq-' + id);
  if (salvo !== null) $(id).value = salvo;
  $(id).addEventListener('change', () => localStorage.setItem('mash-maq-' + id, $(id).value));
});
const codigo = () => $('inCodigo').value.trim();

// LCD 20x4: cada linha tem exatamente 20 caracteres, sem acento (como o LCD real)
function linha(n, texto = '') { lcd[n].textContent = texto.slice(0, 20).padEnd(20); }

function leds({ luz = false, verde = false, vermelho = false, amarelo = false } = {}) {
  $('ledLuz').classList.toggle('on', luz);
  $('ledVerde').classList.toggle('on', verde);
  $('ledVermelho').classList.toggle('on', vermelho);
  $('ledAmarelo').classList.toggle('on', amarelo);
}

// Buzzer pelo Web Audio (o navegador só libera o som depois do primeiro clique)
function bip(vezes, frequencia) {
  if (!audio) return;
  for (let i = 0; i < vezes; i++) {
    const osc = audio.createOscillator(), ganho = audio.createGain();
    const t = audio.currentTime + i * 0.18;
    osc.frequency.value = frequencia;
    ganho.gain.setValueAtTime(0.08, t);
    ganho.gain.setValueAtTime(0, t + 0.12);
    osc.connect(ganho).connect(audio.destination);
    osc.start(t);
    osc.stop(t + 0.13);
  }
}

function telaOciosa() {
  estado = 'OCIOSO';
  leds();
  linha(0, 'MASH Teste de Iodo');
  linha(1, 'Pingue o iodo e');
  linha(2, 'aperte ANALISAR');
  linha(3, `Rede:${conectado ? 'OK ' : '-- '} Camera:${cameraOnline ? 'OK' : '--'}`);
}

function pedirAnalise() {
  if (!audio) audio = new AudioContext();
  if (estado === 'AGUARDANDO') return;
  if (!conectado) {
    linha(0, 'Sem conexao'); linha(1, 'Verifique a rede'); linha(2); linha(3);
    bip(2, 300);
    setTimeout(telaOciosa, 1500);
    return;
  }
  numeroPedido++;
  estado = 'AGUARDANDO';
  inicioEstado = Date.now();
  leds({ luz: true }); // acende a iluminação para a foto
  linha(0, 'Analisando...');
  linha(1, 'Lendo a cor da gota');
  linha(2);
  canal.publicar('pedido', String(numeroPedido));
  bip(1, 1000);
}

// Resultado chega como "CLASSE;h=..;s=..;v=..;m=<motivo>;l=<luz %>;n=.."
function mostrarResultado(msg) {
  const [classe, ...campos] = msg.split(';');
  const dados = Object.fromEntries(campos.map(c => c.split('=')));
  const luz = dados.l !== undefined ? `Luz: OK (${dados.l}%)` : 'Luz: OK';
  estado = 'RESULTADO';
  inicioEstado = Date.now();
  if (classe === 'SEM_AMIDO') {
    leds({ verde: true });
    linha(0, 'RESULTADO: SEM AMIDO'); linha(1, 'Conversao concluida'); linha(2, 'Pode seguir'); linha(3, luz);
    bip(1, 1500);
  } else if (classe === 'AMIDO_PRESENTE') {
    leds({ vermelho: true });
    linha(0, 'AMIDO PRESENTE'); linha(1, 'Manter a rampa'); linha(2, 'Repetir o teste'); linha(3, luz);
    bip(3, 600);
  } else if (classe === 'INCONCLUSIVO' && dados.m === 'luz') {
    leds({ amarelo: true });
    linha(0, 'POUCA LUZ' + (dados.l !== undefined ? ` (${dados.l}%)` : ''));
    linha(1, 'Acenda a luz ou');
    linha(2, 'confira se o anel');
    linha(3, 'esta sobre o branco');
    bip(2, 400);
  } else if (classe === 'INCONCLUSIVO' && dados.m === 'gota') {
    leds({ amarelo: true });
    linha(0, 'NENHUMA GOTA'); linha(1, 'Centralize a gota'); linha(2, 'Tente de novo'); linha(3, luz);
    bip(2, 400);
  } else if (classe === 'INCONCLUSIVO' && dados.m === 'cor') {
    leds({ amarelo: true });
    linha(0, 'COR NAO RECONHECIDA'); linha(1, 'Nao e azul/escura'); linha(2, 'nem amarela/ambar'); linha(3, luz);
    bip(2, 400);
  } else if (classe === 'ERRO') {
    const opencv = msg.includes('opencv');
    leds({ amarelo: true });
    linha(0, 'CAMERA NAO PRONTA');
    linha(1, opencv ? 'Visao ainda' : 'Camera desligada');
    linha(2, opencv ? 'carregando' : 'no celular');
    linha(3, 'Tente de novo');
    bip(2, 400);
  } else {
    leds({ amarelo: true });
    linha(0, 'NAO FOI POSSIVEL LER'); linha(1, 'Centralize a gota'); linha(2, 'no circulo e tente'); linha(3, 'de novo');
    bip(2, 400);
  }
}

function aoMensagem(nome, texto) {
  if (nome === 'resultado' && estado === 'AGUARDANDO') mostrarResultado(texto);
  if (nome === 'camera') {
    cameraOnline = texto === 'online';
    if (estado === 'OCIOSO') telaOciosa();
  }
}

async function conectar() {
  if (canal) canal.fechar();
  canal = null;
  conectado = false;
  cameraOnline = false;
  linha(0, 'MASH Teste de Iodo'); linha(1, 'Conectando...'); linha(2, 'Codigo: ' + codigo()); linha(3);
  const modo = await escolherModo($('inModo').value);
  $('stModo').textContent = modo === 'local' ? 'local (sem internet)' : 'online';
  try {
    canal = await conectarCanal({
      modo,
      codigo: codigo(),
      ultimaVontade: { canal: 'status', texto: 'offline' },
      aoMensagem,
      aoEstado: ligado => {
        conectado = ligado;
        if (ligado && canal) canal.publicar('status', 'online', true);
        if (estado === 'OCIOSO') telaOciosa();
      },
    });
    canal.publicar('status', 'online', true);
  } catch (e) {
    console.error(e);
  }
  telaOciosa();
}

// Relógio da máquina: contagem da espera e volta para a tela inicial
setInterval(() => {
  const passou = Date.now() - inicioEstado;
  if (estado === 'AGUARDANDO') {
    linha(3, `Aguardando camera ${Math.max(0, Math.ceil((TIMEOUT_MS - passou) / 1000))}s`);
    if (passou > TIMEOUT_MS) {
      leds();
      linha(0, 'Camera nao respondeu'); linha(1, 'Abra a pagina no'); linha(2, 'celular e confira'); linha(3, 'o codigo: ' + codigo());
      bip(2, 300);
      estado = 'RESULTADO';
      inicioEstado = Date.now();
    }
  } else if (estado === 'RESULTADO' && passou > RESULTADO_MS) {
    telaOciosa();
  }
}, 200);

$('btnAnalisar').addEventListener('click', pedirAnalise);
$('btnConectar').addEventListener('click', conectar);
addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); pedirAnalise(); }
});

conectar();
</script>
</body>
</html>
